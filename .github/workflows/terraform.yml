name: Terraform Apply

on:
  push:
    branches:
      #- main
      - feat/terraform

permissions:
  contents: read
  id-token: write          # Required for GCP authentication
  pull-requests: write     # Required for PR plan approval comments

jobs:
  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/295233741425/locations/global/workloadIdentityPools/my-pool-1/providers/my-pool-1'
          service_account: 'demo-service@my-project-44865-424207.iam.gserviceaccount.com' 

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Apply
        uses: dflook/terraform-apply@v1
        with:
          path: ./infra
          auto_approve: true
