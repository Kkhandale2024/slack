name: Terraform Apply

on:
  push:
    branches:
      - feat/terraform

jobs:
  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        uses: dflook/terraform-apply@v1
        with:
          path: ./infra
          auto_approve: false  # Ensures only approved plans are applied
